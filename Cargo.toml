[workspace]
resolver = "3"
members = [
    "crates/vizx-app",
    "crates/vizx-audio",
    "crates/vizx-core",
    "crates/vizx-milkdrop",
    "crates/vizx-project",
    "crates/vizx-visualizer",
]

# Values shared by every crate in the workspace. A crate opts in with
# `version.workspace = true` etc., so there is one place to bump them.
[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/psekiewicz/vizx"

# Single source of truth for dependency versions. Crates reference these with
# `name.workspace = true`, which keeps every crate on the same version.
[workspace.dependencies]
vizx-audio = { path = "crates/vizx-audio" }
vizx-core = { path = "crates/vizx-core" }
vizx-milkdrop = { path = "crates/vizx-milkdrop" }
vizx-project = { path = "crates/vizx-project" }
vizx-visualizer = { path = "crates/vizx-visualizer" }

# egui_dock 0.21 is built against egui 0.36, so eframe/egui must stay on 0.36
# until egui_dock publishes a release for a newer egui.
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts", # bundled UI fonts, identical on every OS
    "wgpu",          # render the UI through wgpu (no OpenGL-only path)
    "x11",           # Linux display servers; ignored on Windows
    "wayland",
] }
egui_dock = "0.21"
# The same wgpu that eframe draws the window with, used directly to render
# visualizer plugins off-screen. Must stay on eframe's wgpu version.
wgpu = "30"
# Waits for wgpu's asynchronous calls to finish ("block on").
pollster = "1"
# Native open/save file dialogs of the operating system.
rfd = "0.18"
# Compresses pre-rendered frames as JPEG images. Several times faster than
# the encoder in `image`, which matters when storing thousands of frames.
jpeg-encoder = { version = "0.7", features = ["simd"] }
# Decompresses those frames again for display.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Loads a dynamic library (DLL / .so) at run time; used for projectM.
libloading = "0.8"
# Raw Windows API, used only to create the off-screen OpenGL context for
# projectM. Each crate lists the API areas (features) it needs.
windows-sys = "0.61"
# Sends audio to the sound card (WASAPI on Windows, ALSA on Linux).
cpal = "0.18"
# Reads audio files (pure Rust, no system libraries). Only the formats
# listed here are compiled in.
symphonia = { version = "0.6", default-features = false, features = [
    "aac",
    "flac",
    "isomp4",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
# Fast Fourier transform: splits sound into its frequencies (the spectrum).
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Smaller debug info: noticeably less disk usage and faster linking on the
# modest development laptop, while panics/backtraces still show file:line.
[profile.dev]
debug = "line-tables-only"

# Compile dependencies with optimizations even in debug builds. Audio
# decoding and UI rendering are many times faster this way, while VizX's own
# crates still build quickly and stay easy to debug. The cost is a longer
# first build.
[profile.dev.package."*"]
opt-level = 2

# VizX's own crates that process audio samples or pixels in tight loops need
# the same treatment: unoptimized, those loops are many times slower.
[profile.dev.package.vizx-audio]
opt-level = 2

[profile.dev.package.vizx-core]
opt-level = 2

[profile.dev.package.vizx-milkdrop]
opt-level = 2

[profile.dev.package.vizx-visualizer]
opt-level = 2
