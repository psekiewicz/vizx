[package]
name = "vizx-core"
description = "VizX shared application logic. No GUI code."
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
vizx-audio.workspace = true
vizx-milkdrop.workspace = true
vizx-ml.workspace = true
vizx-render.workspace = true
vizx-visualizer.workspace = true
ab_glyph.workspace = true
epaint_default_fonts.workspace = true
image.workspace = true
jpeg-encoder.workspace = true
vizx-project.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true

# Whether the VizX that wrote an autosave is still running.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }
